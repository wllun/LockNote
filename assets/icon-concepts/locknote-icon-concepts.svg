  <text x="92" y="612" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Privacy shown through negative space.</text>
  <text x="92" y="641" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Most distinctive and least cluttered.</text>
  <text x="572" y="612" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Security-first, formal, and trustworthy.</text>
  <text x="572" y="641" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Best if protection is the main promise.</text>
  <text x="1052" y="612" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Literal and immediately understandable.</text>
  <text x="1052" y="641" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Friendlier, but more conventional.</text>

